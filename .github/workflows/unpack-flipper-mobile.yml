name: Unpack Flipper Mobile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          ZIP=$(find . -type f -name "FlipperMobile_Android_1.0_FULL_50MB.zip" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: FlipperMobile_Android_1.0_FULL_50MB.zip not found"
            exit 1
          fi

          echo "ZIP found: $ZIP"
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Prepare extraction directory
        run: |
          mkdir -p extracted

      - name: Unpack Flipper Mobile
        run: |
          unzip -o "$ZIP_PATH" -d extracted

      - name: Copy project to repository root
        run: |
          cp -a extracted/. .

          rm -rf extracted

          echo "Project extracted successfully."
          echo
          echo "Root files:"
          ls -la

      - name: Check Gradle Wrapper
        run: |
          test -f gradlew
          test -f gradlew.bat
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradle/wrapper/gradle-wrapper.jar

          chmod +x ./gradlew

          echo "Gradle Wrapper found."

      - name: Check Android project
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -d app

          echo "Android project structure OK."

      - name: Remove ZIP from repository
        run: |
          rm -f "$ZIP_PATH"

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract Flipper Mobile Android project"
          git push
